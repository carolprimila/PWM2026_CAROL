# PostgreSQL + API + Web administrativo.
# Uso:  cp .env.example .env  (preencha os valores)  &&  docker compose up -d --build
# Somente o banco:  docker compose up -d postgres
# Produção: coloque um proxy reverso com HTTPS (Caddy, Nginx, Traefik) na frente da Web e da API — ver docs/deploy/PRODUCAO.md.
services:
  postgres:
    image: postgres:17-alpine
    container_name: projetoclubes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projetoclubes}
      POSTGRES_USER: ${POSTGRES_USER:-projetoclubes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      # Só na máquina local: o banco nunca fica exposto na rede.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
      - ./database/scripts/init:/docker-entrypoint-initdb.d:ro
    networks: [clubes]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Backend/ProjetoClubes.API/Dockerfile
    container_name: projetoclubes-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-projetoclubes};Username=${POSTGRES_USER:-projetoclubes};Password=${POSTGRES_PASSWORD}
      Jwt__Chave: ${JWT_CHAVE:?Defina JWT_CHAVE no arquivo .env (mínimo 32 caracteres)}
      Banco__AplicarMigrationsAoIniciar: ${APLICAR_MIGRATIONS:-true}
      Setup__Token: ${SETUP_TOKEN:-}
      Seed__Demo: ${SEED_DEMO:-false}
      Seed__SenhaDemo: ${SEED_SENHA_DEMO:-}
      Autenticacao__UrlRedefinicaoSenha: ${WEB_URL:-http://localhost:5278}/redefinir-senha
      Swagger__Habilitado: ${SWAGGER_HABILITADO:-false}
      Proxy__RedesConfiaveis__0: 172.28.0.0/16
      Email__Provedor: ${EMAIL_PROVEDOR:-Arquivo}
      Email__Remetente: ${EMAIL_REMETENTE:-nao-responda@projetoclubes.local}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Porta: ${SMTP_PORTA:-587}
      Email__Smtp__Usuario: ${SMTP_USUARIO:-}
      Email__Smtp__Senha: ${SMTP_SENHA:-}
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      - api-dados:/app/App_Data
    networks: [clubes]
    # Monitoramento: GET /health (verifica também o PostgreSQL). A imagem aspnet não traz curl/wget para healthcheck interno.

  web:
    build:
      context: .
      dockerfile: src/Web/ProjetoClubes.Web/Dockerfile
    container_name: projetoclubes-web
    restart: unless-stopped
    depends_on: [api]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ApiBaseUrl: http://api:8080/
      DataProtection__Pasta: /app/chaves
    ports:
      - "${WEB_PORT:-5278}:8080"
    volumes:
      - web-chaves:/app/chaves
    networks: [clubes]

networks:
  clubes:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-dados:
  api-dados:
  web-chaves:
