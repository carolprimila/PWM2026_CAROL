# API + Web administrativo (opcional: para desenvolver basta abrir no Visual Studio — ver README).
# O banco é SQLite, num arquivo dentro do volume api-dados.
# Uso:  cp .env.example .env  (preencha JWT_CHAVE)  &&  docker compose up -d --build
# Produção: coloque um proxy reverso com HTTPS (Caddy, Nginx, Traefik) na frente da Web e da API — ver docs/deploy/PRODUCAO.md.
services:
  api:
    build:
      context: .
      dockerfile: src/ProjetoClubes.Api/Dockerfile
    container_name: projetoclubes-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Data Source=/app/App_Data/projetoclubes.db
      Jwt__Chave: ${JWT_CHAVE:?Defina JWT_CHAVE no arquivo .env (mínimo 32 caracteres)}
      Banco__AplicarMigrationsAoIniciar: ${APLICAR_MIGRATIONS:-true}
      Setup__Token: ${SETUP_TOKEN:-}
      Seed__Demo: ${SEED_DEMO:-false}
      Seed__SenhaDemo: ${SEED_SENHA_DEMO:-}
      Autenticacao__UrlRedefinicaoSenha: ${WEB_URL:-http://localhost:5278}/redefinir-senha
      Swagger__Habilitado: ${SWAGGER_HABILITADO:-false}
      Proxy__RedesConfiaveis__0: 172.28.0.0/16
      Email__Provedor: ${EMAIL_PROVEDOR:-Arquivo}
      Email__Remetente: ${EMAIL_REMETENTE:-nao-responda@projetoclubes.local}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Porta: ${SMTP_PORTA:-587}
      Email__Smtp__Usuario: ${SMTP_USUARIO:-}
      Email__Smtp__Senha: ${SMTP_SENHA:-}
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      - api-dados:/app/App_Data
    networks: [clubes]
    # Monitoramento: GET /health (verifica também o banco). A imagem aspnet não traz curl/wget para healthcheck interno.

  web:
    build:
      context: .
      dockerfile: src/ProjetoClubes.Web/Dockerfile
    container_name: projetoclubes-web
    restart: unless-stopped
    depends_on: [api]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ApiBaseUrl: http://api:8080/
      DataProtection__Pasta: /app/chaves
    ports:
      - "${WEB_PORT:-5278}:8080"
    volumes:
      - web-chaves:/app/chaves
    networks: [clubes]

networks:
  clubes:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  api-dados:
  web-chaves:
